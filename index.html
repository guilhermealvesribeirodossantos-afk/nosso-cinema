<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#09040f">

    <title>Nosso Cinema 💜</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <section class="hero">

            <div class="hero-overlay"></div>

            <div class="hero-content">

                <div class="heart">
                    ♡
                </div>

                <p class="small-title">
                    VOCÊ + MALU
                </p>

                <h1>
                    Nosso
                    <span>Cinema</span>
                </h1>

                <p class="subtitle">
                    Mesmo longe, ainda podemos
                    viver cada história juntos.
                </p>

                <button
                    class="main-button"
                    id="enterButton"
                    type="button"
                >
                    <span>▶</span>
                    Entrar no nosso cinema
                </button>

                <button
                    class="secondary-button"
                    type="button"
                >
                    ♡ Nossa história
                </button>

            </div>

        </section>


        <section class="home hidden" id="home">

            <header class="topbar">

                <div>
                    <p class="welcome">
                        Boa noite, amor 💜
                    </p>

                    <h2>
                        O que vamos assistir?
                    </h2>
                </div>

                <div class="couple-avatar">
                    ♡
                </div>

            </header>


            <section class="couple-card">

                <div class="couple-info">

                    <span class="online-dot"></span>

                    <div>
                        <strong>Você & Malu</strong>
                        <p>Nossa sala está esperando</p>
                    </div>

                </div>

                <button type="button">
                    Entrar
                </button>

            </section>


            <section class="section">

                <div class="section-header">
                    <h3>Assistir juntos</h3>
                    <span>Escolha um serviço</span>
                </div>

                <div class="services">

                    <button class="service netflix">
                        N
                        <small>Netflix</small>
                    </button>

                    <button class="service prime">
                        prime
                        <small>Prime Video</small>
                    </button>

                    <button class="service disney">
                        Disney+
                        <small>Disney+</small>
                    </button>

                    <button class="service max">
                        max
                        <small>Max</small>
                    </button>

                    <button class="service youtube">
                        ▶
                        <small>YouTube</small>
                    </button>

                    <button class="service more">
                        +
                        <small>Outros</small>
                    </button>

                </div>

            </section>


            <section class="love-card">

                <span>♡</span>

                <div>
                    <p>
                        NOSSO CANTINHO
                    </p>

                    <h3>
                        Cada filme é mais uma memória nossa.
                    </h3>
                </div>

            </section>


            <nav class="bottom-nav">

                <button class="active">
                    <span>⌂</span>
                    Início
                </button>

                <button>
                    <span>▶</span>
                    Sala
                </button>

                <button>
                    <span>♡</span>
                    Lista
                </button>

                <button>
                    <span>☵</span>
                    Chat
                </button>

                <button>
                    <span>○</span>
                    Perfil
                </button>

            </nav>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
